; =====================================================================
;  NoGoggles settings
;  Anything after a ; is a note and is ignored.
;
;  [Display] changes take effect the next time SteamVR starts.
;  [Look] and [Crosshair] changes take effect within a second, even mid-game.
;  [Game:...] sections at the bottom let each game have its own settings.
;  Just save this file - no need to restart for [Look].
; =====================================================================

[Display]
; Fill the whole main monitor (yes) or use the window size below (no).
Fullscreen = no

; Window position and size, in pixels (ignored when Fullscreen = yes).
WindowX = 100
WindowY = 100
WindowWidth = 1600
WindowHeight = 900

; How wide the view is, left to right, in degrees.
; Lower = more zoomed in, higher = see more but edges look stretched.
; 80-100 is comfortable on a monitor.
FieldOfView = 90

; 1.0 renders at the window size. 1.5 is sharper but harder on the PC.
RenderScale = 1.0

; Monitor refresh rate in Hz. 60 is safe; use 120/144 if your screen does that.
RefreshRate = 60


[Look]
; ---- Mouse ----
; Press this key to start/stop steering your head with the mouse.
; While it's on, the mouse pointer is held in the middle
; of the NoGoggles window. Press it again to get your pointer back.
MouseLookToggleKey = F8
MouseSensitivity = 0.15
InvertY = no

; ---- Gamepad ----
; Which stick turns your head: right, left or off.
GamepadStick = right
; Turning speed in degrees per second at full tilt.
GamepadSpeed = 120
; How far the stick must move before it counts (0.0 - 0.9).
GamepadDeadzone = 0.20
; If the game also uses that stick for something, set a button here and the
; stick will only turn your head while you hold it.
; Options: none, A, B, X, Y, LB, RB, LT, RT, LS, RS, Back, Start, DUp, DDown, DLeft, DRight
GamepadHoldButton = none

; ---- Keyboard ----
; Arrow keys (or numpad 8/4/6/2) turn your head.
KeyboardLook = yes
KeyboardSpeed = 90

; ---- General ----
; Snap the view back to straight ahead.
RecenterKey = F9
; Same thing from the gamepad. RS = click the right stick (R3).
; Use none, a button name from the list above, or a combo like LB+RB.
RecenterGamepadButton = RS

; How far you can look up or down, in degrees.
MaxLookUpDown = 80

; Tells SteamVR how fast you're turning so it can keep up. This stops the
; black strip appearing at the edge of the screen while you turn.
PredictTurning = yes

; Smooth out the movement a little. 0 = off, 0.5 = some, 0.9 = a lot.
Smoothing = 0

; Height of your "head" in metres above the floor. 0.7 works for
; Rhombus of Ruin. Too low or too high gives "HMD Tracking Error".
; Best changed with the game closed - changing it mid-game can make the
; view go wonky until you restart the game.
HeadHeight = 0.7

; Hold this key for one second to close SteamVR (and the NoGoggles window)
; after you quit the game.
QuitKey = F10
; Same from the gamepad: hold these together for a moment.
; This closes the game first, then SteamVR.
QuitGamepadButtons = Back+Start

; The game's OWN recenter button (Back/Select in Rhombus of Ruin).
; Without a headset, the game's recenter makes it think your head dropped
; to the floor ("HMD Tracking Error"). NoGoggles watches this button and
; lifts the head back up right after. Set to none if a game has no such
; button, or if pressing it makes things worse.
GameRecenterButton = Back

; Little messages at the top of the screen ("Mouse look ON", "View recentered").
OnScreenMessages = yes


[Crosshair]
; A small dot in the middle of the screen showing exactly where you're
; looking - which is what the game uses to pick things.
Show = yes
; Size in pixels.
Size = 10
; 0.1 = barely visible, 1.0 = solid.
Opacity = 0.75
; Press this key to hide/show the dot (handy during cutscenes).
ToggleKey = F7
; Same from the gamepad. LS = click the left stick (L3).
ToggleGamepadButton = LS


[Windows]
; Games only listen to the gamepad while their own window is the active
; one - but you want to look at the NoGoggles window. These two settings
; handle that for you:
;
; Keep the NoGoggles window in front of everything (including the game's
; own squashed window), so it's always what you see.
KeepNoGogglesOnTop = yes
; Make the game's window the active one when it starts, and again whenever
; a SteamVR popup grabs focus - so the gamepad keeps working. It never
; takes focus away from other programs you switch to.
AutoFocusGame = yes
; (Alt+Tab still works to get to other programs.)

; When you quit the game, close SteamVR too (after about 5 seconds),
; instead of leaving you in SteamVR's empty room.
CloseSteamVRWithGame = yes


; =====================================================================
;  Per-game settings
;
;  Make a section called [Game:Any Name You Like] and put the game's
;  program name after Exe = . While that program is running, any setting
;  you list in the section replaces the one from [Look] or [Crosshair].
;  Settings you don't list stay as they are above.
;
;  To find a game's program name: start the game, open Task Manager
;  (Ctrl+Shift+Esc), go to the Details tab and look for the game.
;  Several names can be listed with commas: Exe = one.exe, two.exe
;
;  Remove the ; at the start of each line to switch an example on.
; =====================================================================

;[Game:Eagle Flight]
;Exe = EagleFlight.exe      ; example - check the real name in Task Manager
;GamepadStick = right
;GamepadSpeed = 180
;Show = no
